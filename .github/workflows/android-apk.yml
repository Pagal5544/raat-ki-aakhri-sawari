name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Godot Build Environment
        run: |
          echo "=== Godot Version Check ==="
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux_x86_64.zip"
          unzip -o godot.zip
          export GODOT_BIN="$PWD/Godot_v4.3-stable_linux_x86_64/Godot_v4.3-stable_linux_x86_64"
          echo "$PWD/Godot_v4.3-stable_linux_x86_64" >> $GITHUB_PATH
          echo "GODOT_BIN=$GODOT_BIN"
          echo "=== Godot --version ==="
          $GODOT_BIN --headless --version
          # Install export templates using .tpz format from GitHub releases
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          tar -xvf templates.tpz
          if [ -d templates_temp/templates ]; then
            cp -r templates_temp/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          else
            echo "ERROR: templates folder not found after extraction!"
            ls -la
            exit 1
          fi
          rm -rf templates.tpz templates_temp
          echo "=== Templates installed ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export Android APK - Debug
        run: |
          mkdir -p builds
          $GODOT_BIN --headless --export-debug "Android" builds/raat_ki_aakhri_sawari_debug.apk
          echo "=== Listing Android export presets ==="
          $GODOT_BIN --headless --list-presets 2>&1 | head -30 || true
          if [ ! -s builds/raat_ki_aakhri_sawari_debug.apk ]; then
            echo "::error::Debug APK file is empty or missing."
            exit 1
          fi
          echo "Debug APK created successfully."

      - name: Export Android APK - Release
        run: |
          $GODOT_BIN --headless --export-release "Android" builds/raat_ki_aakhri_sawari_release.apk
          if [ ! -s builds/raat_ki_aakhri_sawari_release.apk ]; then
            echo "::error::Release APK file is empty or missing."
            exit 1
          fi
          echo "Release APK created successfully."

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            builds/raat_ki_aakhri_sawari_debug.apk
            builds/raat_ki_aakhri_sawari_release.apk
