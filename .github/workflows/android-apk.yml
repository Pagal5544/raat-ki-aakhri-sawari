name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Godot Build Environment
        run: |
          echo "=== Godot Version Check ==="
          curl -L "https://downloads.godotengine.org/godot/4.3/Godot_v4.3-stable_mono_linux.zip" -o godot.zip
          unzip -o godot.zip
          export GODOT_BIN="$PWD/Godot_v4.3-stable_mono_linux/Godot_v4.3-stable_mono_linux.64"
          echo "$PWD/Godot_v4.3-stable_mono_linux" >> $GITHUB_PATH
          
          echo "=== Godot --help ==="
          $GODOT_BIN --help | head -20
          
          # Install export templates - handle archive's inner 'templates' directory
          curl -L "https://github.com/godotengine/godot/releases/download/4.3.stable/Godot_v4.3-stable_export_templates.tgz" -o templates.tgz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          tar -xvf templates.tgz
          # The archive contains a 'templates' inner folder - copy files from it
          if [ -d templates ]; then
            cp -r templates/* ~/.local/share/godot/export_templates/4.3.stable/
          else
            # Fallback: copy directly
            tar -xvf templates.tgz -C ~/.local/share/godot/export_templates/4.3.stable
          fi
          rm -rf templates.tgz templates
          echo "=== Templates installed ==="
          ls -la ~/.local/share/godot/export_templates/4.3.stable/
          
      - name: Export Android APK - Debug
        run: |
          mkdir -p builds
          $GODOT_BIN --headless --export-debug "Android" builds/raat_ki_aakhri_sawari_debug.apk
          echo "=== Listing Android export presets ==="
          $GODOT_BIN --headless --list-presets 2>&1 || true
          if [ ! -s builds/raat_ki_aakhri_sawari_debug.apk ]; then
            echo "::error::Debug APK file is empty or missing."
            exit 1
          fi
          echo "Debug APK created successfully."
          
      - name: Export Android APK - Release
        run: |
          $GODOT_BIN --headless --export-release "Android" builds/raat_ki_aakhri_sawari_release.apk
          if [ ! -s builds/raat_ki_aakhri_sawari_release.apk ]; then
            echo "::error::Release APK file is empty or missing."
            exit 1
          fi
          echo "Release APK created successfully."
          
      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            builds/raat_ki_aakhri_sawari_debug.apk
            builds/raat_ki_aakhri_sawari_release.apk
