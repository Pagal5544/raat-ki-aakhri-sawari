name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3 Linux headless
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip godot.zip -d godot_bin

      - name: Download Godot 4.3 Android export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip templates.tpz -d templates_temp
          cp -r templates_temp/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates_temp templates.tpz godot.zip

      - name: Set up headless Godot binary
        run: |
          chmod +x godot_bin/Godot_v4.3-stable_linux.x86_64
          echo "GODOT_BIN=$(pwd)/godot_bin/Godot_v4.3-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Check for project.godot
        run: |
          if [ ! -f project.godot ]; then
            echo "::error::project.godot not found. This is not a valid Godot project directory."
            echo "Make sure the root of the repository contains the Godot project configuration file."
            exit 1
          fi

      - name: Check for export_presets.cfg
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg not found. Android export preset is missing."
            echo "Create an Android export preset in Godot 4 and commit the resulting export_presets.cfg file."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p builds
          $GODOT_BIN --headless --export-debug "Android" builds/raat_ki_aakhri_sawari_debug.apk
          if [ ! -s builds/raat_ki_aakhri_sawari_debug.apk ]; then
            echo "::error::APK file is empty or missing."
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/raat_ki_aakhri_sawari_debug.apk
